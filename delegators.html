<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description" content="Private raffle results for The Dutch Stake Pool delegators.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://esm.sh; style-src 'self' https://fonts.googleapis.com; connect-src 'self' https://api.tdsp.online https://esm.sh; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; form-action 'self'">
    <meta name="referrer" content="no-referrer">
    <title>Delegators | The Dutch Stake Pool</title>
    <link rel="icon" href="tdsp_logo_ico.webp" type="image/webp">
    <link rel="stylesheet" href="styles.css?v=20260813-static-overlay-search">
    <link rel="stylesheet" href="raffle.css?v=20260814-raffle-access">
    <script src="runtime.js?v=20260808-runtime-export-cleanup" defer></script>
    <script src="raffle-access.js?v=20260814-raffle-access" defer></script>
</head>
<body class="raffle-page" data-raffle-role="delegator">
    <header class="raffle-header">
        <a class="raffle-brand" href="index.html" aria-label="The Dutch Stake Pool home">
            <img src="tdsp_logo_ico.webp?v=20260727-smooth-lines" alt="" width="44" height="44">
            <span>The Dutch Stake Pool</span>
        </a>
        <nav aria-label="Raffle navigation">
            <a aria-current="page" href="delegators.html">Delegators</a>
            <a href="admin.html">Admin Area</a>
        </nav>
    </header>

    <main class="raffle-main">
        <section class="raffle-shell" id="raffle-access">
            <p class="eyebrow">TDSP Delegators</p>
            <h1>Delegator Raffles</h1>
            <p>Sign a one-time wallet challenge with a stake key currently delegated to TDSP. This does not create a transaction or cost ADA.</p>
            <button id="raffle-connect" class="raffle-primary" type="button">Connect Delegator Wallet</button>
            <div id="raffle-wallet-list" class="wallet-list raffle-wallet-list"></div>
        </section>

        <section class="raffle-shell" id="raffle-protected" hidden>
            <div class="raffle-title-row">
                <div>
                    <p class="eyebrow">Verified TDSP delegator</p>
                    <h1>Delegator Raffles</h1>
                </div>
                <button id="raffle-logout" class="raffle-secondary" type="button">Lock</button>
            </div>
            <div id="raffle-identity" class="governance-menu-card raffle-identity"></div>
            <div class="raffle-section-heading">
                <h2>Published Results</h2>
            </div>
            <div class="raffle-draws" id="raffle-draws"></div>
        </section>
        <p id="raffle-status" class="wallet-status raffle-status" role="status" aria-live="polite" hidden></p>
    </main>
</body>
</html>
