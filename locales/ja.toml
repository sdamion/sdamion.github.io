portfolio_text_b49844af63a7 = "認証済みのステークアドレスは自動追加されます。関連する支払アドレス、残高、取引を読み込みます。Cardanoウォレットで自分のウォレットを追加し、取引所やSwapのラベルを管理できます。"
portfolio_text_7c439812b22a = "Cardanoウォレットは10件以上の取引がある、分析済みの有効なアドレスのみを数えます。マイウォレットはそれらを含むウォレットを数えます。非表示・除外アドレスは件数に含まれませんが、残高、取引の所有権、損益は変わりません。"
portfolio_text_00597ed883d1 = "読み込み済み取引が10件未満のアドレスは標準で非表示です。フィルターを解除すると表示されます。分析完了後は通常の更新を省略しますが、残高・履歴・所有権は保持されます。再確認には全ウォレット再スキャンを使います。表示だけでは再スキャンしません。"
portfolio_text_c7ab702881c8 = "ウォレット名や関連アドレス数をクリックすると、アドレスごとのウォレット、アドレス、ADA、取引数を表示します。リンクはCardanoscanを開きます。件数は読み込み・分析済みの履歴に基づきます。"
portfolio_text_16b12395c134 = "更新から除外すると、そのアドレスの残高・履歴リクエストを省略します。キャッシュと所有権は保持されます。共有取引は別の有効アドレス経由で更新されることがあります。更新中でも変更可能です。除外には保存済み残高が必要です。"
portfolio_text_bc95ec437aeb = "除外アドレスを非表示にしてもデータは削除しません。解除して再有効化すると、省略していた履歴を確認します。Cardanoウォレットの有効数／総数は一意の支払アドレス数で、ステーク口座や取引所ラベル数ではありません。"
portfolio_text_53fe1bca6511 = "すべて選択は保存済み残高がある全アドレスを更新から除外します。すべて解除は再有効化します。非表示アドレスも対象で、選択した保存先に設定を保存します。"
portfolio_text_3224f5e247c2 = "上部の更新アイコンを使います。アドレスと残高を読み込んだ後、取引の件数確認と分析を並行します。取引カードに進捗とアップロードを表示します。完了までは値が不完全な場合があります。"
portfolio_text_71cc8c4b7374 = "保存済み履歴を可能な限り再利用します。新規アドレスや未分析データは時間がかかる場合があります。子画面を閉じても更新は続きます。サイトを開いたままにしてください。除外残高は古くなる場合があります。"
portfolio_text_20d87b0cd7c6 = "完全スキャン後は保存したアドレス一覧で残高と新規取引を確認します。追加ウォレットは別途スキャンします。既存ステークキーの新規支払アドレスは自動検出されないため、マイウォレットから追加してください。"
portfolio_text_2a28ea75fc03 = "完全分析後、取引・残高・資産がないアドレスは保存一覧から削除して以後省略します。除外中や分析未完了のアドレスは保持します。オンチェーンのステークキーは変更しません。後で使う場合はマイウォレットで再追加してください。"
portfolio_text_dfdbf576d1a3 = "全ウォレット再スキャンは削除・除外アドレスも含めて関連アドレスと全履歴を確認します。このスキャンのみ除外を無視します。保存済み取引詳細を再利用し、完了後に空のアドレスを再び削除します。"
portfolio_text_6a4d08c5014d = "取引と分析はトークン価格・画像の更新前に保存します。メタデータ取得に失敗しても取引は保持します。分析完了後にトークンデータを取得中の場合は状態に表示します。"
portfolio_text_001a76011c42 = "全ウォレットの資産はADAと評価済み資産の現在価値をUSDと現在価格でのADA換算額で表示します。開くと保有資産、ウォレット名、資産詳細が見られます。価格不明の資産は小計に含まれません。"
portfolio_text_8f0e993752c8 = "資産詳細では現在価値と取得原価を比較します。ミント・購入費用は現在価格ではありません。NFT最低価格や2 ADAの代替評価は推定であり売却保証ではありません。手動価格と除外は資産詳細で管理します。"
portfolio_text_e5113f14d525 = "ネットワーク手数料は読み込み済み取引から割り当て可能な手数料を集計します。共有入力で確実に割り当てられない手数料は除外します。"
portfolio_text_f4fa3c5eb23b = "ADA損益はADA OUTと全ウォレットの現在資産価値の合計からADA INを引きます。ウォレットのADAと資産は取得原価ではなく現在価値を使います。USD送金額は送金日の価格、資産のADA換算額は現在のADA価格を使います。価格不明の資産は除外されるため部分推定になる場合があります。税金の計算ではありません。"
portfolio_text_bfcc16d4d5c7 = "DEX / CEXラベルは両方向の取引所相手を識別します。ユーザー設定であり、取引所所有の確認ではありません。そのアドレスの残高はポートフォリオに追加しません。"
portfolio_text_656711e3e164 = "Byron DEX / CEXで検出アドレスを確認し、取引所でないものを解除してください。共有取引は一度だけ数えます。表示ボタンで取引とアドレスを確認できます。"
portfolio_text_11b9eecc6c6a = "SwapはCEX分類から除外する内部・サービスアドレスを識別します。ラベルはサービスウォレット全体の所有権を証明しません。追跡ウォレットのアドレスに金額を対応させ、他の受取人の資金を含めません。"
portfolio_text_1aef2faecf54 = "取引画面では資産名、取引ハッシュ、アドレスで検索し、種類・日付フィルターとページを使えます。Cardanoscanで独立に確認できます。資産画像から取得データや手動調整を開きます。"
portfolio_text_6adc466b0d48 = "所有者不明は追跡アドレスとの関連が未確認の保存済み取引です。分析不足だけで他人の取引とは判断できません。"
portfolio_text_807546dc54f5 = "カードで追跡アドレスを選び割り当てを押すと、取引入力・出力にあるか検証します。所有権と金額は確認済み取引データだけで決まります。選択で他人の資金を自分のものにはできません。必要なら先に自分のウォレットを追加してください。"
portfolio_text_5aed3b3369fb = "更新・検証の完了を待ってください。成功した割り当ては保存して不明一覧から削除します。失敗時は所有権や金額を変えません。Cardanoscanでも確認してください。"
portfolio_text_0d9496b97e02 = "ローカルデータは保存前にAES-256-GCMで暗号化します。別のウォレットメッセージ承認で解除し、取引・手数料・アップロードはありません。同じアプリとステーク口座を使用します。ウォレットなしで復旧できません。7日間未使用で期限切れとなり次回訪問時に削除します。"
portfolio_text_61e7830a5582 = "暗号化リモート保存は対応モバイルウォレットでも使えます。別のメッセージ承認で解除し、取引やADA手数料はありません。ブラウザーで暗号化してから送信します。別端末でも同じステーク口座と対応ウォレットを使います。管理者による復旧はできません。"
portfolio_text_301f1b40b266 = "リモートキャッシュは7日間未使用で削除し、ローカルの期限切れデータは次回訪問で削除します。保存先変更で他のコピーは消えません。コピー・削除を確認してください。両方式とも公開チェーン・価格データを取得します。解除中の悪意ある拡張機能やサイトコードからは保護しません。"
portfolio_text_e2933cc452e5 = "ウォレット要求とサイトのドメインを必ず確認してください。アクセス・キャッシュ解除はメッセージ署名であり支払いではありません。予期しない送金・取引は拒否し、推定値をウォレットとオンチェーン記録で確認してください。"
