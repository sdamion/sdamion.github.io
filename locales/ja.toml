portfolio_text_067b22f4142f = " このメンバーのPortfolioキャッシュを削除しますか？保存したウォレット、取引所ラベル、手動価格、分析を削除します。オンチェーン取引と他の保存先は変わりません。"
portfolio_text_471a31b1a33b = "メンバーのステークアドレスには関連支払アドレスが含まれます。自分のウォレットだけ追加してください。"
portfolio_text_40d4f0a54c11 = "関連アドレスと全履歴を再確認します。このスキャンのみ除外アドレスを含みます。保存済み詳細は再利用します。"
portfolio_text_315c1eba757d = "ウォレット、手動価格、履歴は選択した暗号化保存先を使います。手動価格と平均原価は資産・アカウントごとに保存し、ウォレット変更後も保持します。"
portfolio_text_19e2e5758c3e = "資産損益合計への算入を切り替えます。残高、資産価値、手数料、ADA IN/OUTは変わりません。"
portfolio_text_88269ee53025 = "一部の支払い関連付けを適用できません。資産画像を開いて取得支払いを確認してください。"
portfolio_text_6f1c5c732170 = "ミント支払いは取得原価であり現在価格ではありません。損益には市場価格または入力した現在価格が必要です。"
portfolio_text_0fc3055537aa = "この資産の支払いか確認してください。まとめ買いではこの資産分のみ入力します。別の支払いは読み込み済みのADAのみの出金取引が必要です。"
portfolio_text_d844eb2cb753 = "SwapアドレスはCEXから除外します。金額はステークキー関連を含む追跡アドレスで確認し、他の受取人や共有サービス残高を含めません。"
portfolio_text_cc8002de133b = "Byronアドレスは標準選択です。取引所でないものを解除して保存してください。取引所所有は未確認です。自分のウォレットとSwapを除外します。設定は保存しますが残高には加えません。"
portfolio_text_ba2a88bab4b6 = "{name}の詳細を表示"
portfolio_text_5ca5237c7f66 = "{name}をSwapから削除"
portfolio_text_328a4d4c6ba2 = "更新日時 {date}"
portfolio_text_29c296a1f5f9 = "更新中と完了後で残存原価の計算は同じです。ADA履歴は残高、トークンの取得単位は保有数と照合します。不足履歴や価格をゼロとしません。値は新規データで変わり、更新完了自体では変わりません。送金・支出・手数料は比例原価を減らし、内部移動は平均をリセットしません。日次価格は受取時の近似で、約定価格・税務計算ではありません。トークン原価はFIFO、ミント支払い、手動値を使います。実現損益は除き、手数料は保有数に反映済みです。"
portfolio_text_d6d6856c5d03 = "内部移動は全入力・出力が追跡アドレスに属する必要があります。純変動は手数料のみです。混合取引は別扱いです。売買はADAとトークンの逆方向変動から推定し、複数段階DEX注文は追加照合が必要な場合があります。"
portfolio_text_510101dca312 = "資産価値・取得原価・損益を合計と対象件数から除外します。個別詳細は表示します。ADA移動と手数料は変わりません。このPortfolio用に保存します。"
portfolio_text_ffe6a0dfd770 = "保存した取引所アドレスは入金ADAを買い、出金を売りとするルールを使います。DEXスワップを解析しません。選択したPortfolio保存先に保存します。"
portfolio_text_f350e932f9d5 = "公開コントラクト参照であり自分のウォレットではありません。残高・CEX合計・支払手数料を変えません。スクリプトハッシュは契約を識別し支払アドレスではありません。完全なDEX一覧ではありません。"
portfolio_text_7e78d2eef3dc = "対応ウォレットでPC・モバイル・タブレットを利用できます。別のメッセージ承認が必要で取引・手数料はありません。ブラウザーがAES-256-GCMで暗号化し、署名・鍵は送信しません。他端末でも同じステーク口座と対応ウォレットが必要です。管理者復旧はありません。7日間未使用で削除し、バックグラウンド更新は期限を延ばしません。"
portfolio_text_7a171b8b87ff = "両方式ともバックエンドに公開チェーン・価格情報を要求します。暗号化は保存キャッシュを保護しますが、解除中の悪意あるコード・拡張機能は防ぎません。"
portfolio_text_6708d46d11c6 = "コピーしない場合は選択先の保存データを読み込みます。切り替えても別のコピーは削除しません。"
portfolio_text_7d3859f071d8 = "ウォレットとの関連が未確認の取引です。自分のアドレスを選んで検証・分析します。金額は実際の入力・出力だけで決まります。"
portfolio_text_09fbf60bffa4 = "除外アドレスの残高と履歴は保持します。変更は次回更新から適用します。共有取引は他のアドレス経由で更新される場合があります。"
portfolio_text_ba6bcd6b3673 = "完全分析後、10件未満のアドレスは通常更新を省略します。残高・取引の所有権は保持します。再確認には全ウォレット再スキャンを使います。"
portfolio_text_6493809745be = "更新して古い取引の送受信者ステークアドレスを取得します。"
