portfolio_text_067b22f4142f = " caché de Portfolio de este miembro? Se borrarán wallets, etiquetas, precios manuales y análisis de esta copia. Las transacciones on-chain y la otra ubicación no cambian."
portfolio_text_471a31b1a33b = "Tu dirección de stake incluye las direcciones de pago vinculadas. Añade solo wallets propias."
portfolio_text_40d4f0a54c11 = "Redescubre direcciones y revisa todo el historial, incluyendo excluidas solo en este escaneo. Se reutilizan detalles guardados."
portfolio_text_315c1eba757d = "Wallets, precios e historial usan el almacenamiento cifrado elegido. Los precios manuales y costes medios se guardan por activo y miembro y se conservan al cambiar wallets."
portfolio_text_19e2e5758c3e = "Controla la inclusión en el total de ganancias/pérdidas de activos. Saldos, valores, comisiones y ADA IN/OUT no cambian."
portfolio_text_88269ee53025 = "Algunos vínculos de pago no se pueden aplicar. Abre la imagen del activo para revisar sus compras."
portfolio_text_6f1c5c732170 = "Los pagos de mint son costes, no precios actuales. Ganancias/pérdidas necesita un precio de mercado o actual introducido."
portfolio_text_0fc3055537aa = "Confirma que el pago corresponde al activo. Para lotes indica solo su parte. Un pago separado debe ser una transacción saliente solo ADA del historial cargado."
portfolio_text_d844eb2cb753 = "Swap se excluye de CEX. Los importes se vinculan a tus direcciones seguidas, incluidas las de tu stake key. No se cuentan otros destinatarios ni saldos compartidos."
portfolio_text_cc8002de133b = "Las direcciones Byron se seleccionan por defecto. Desmarca las que no sean exchanges y guarda. No se verifica su titularidad. Tus wallets y Swap se excluyen. Se guarda la selección sin añadir saldos."
portfolio_text_ba2a88bab4b6 = "Ver detalles de {name}"
portfolio_text_5ca5237c7f66 = "Eliminar {name} de Swap"
portfolio_text_328a4d4c6ba2 = "Actualizado {date}"
portfolio_text_29c296a1f5f9 = "El coste restante se calcula igual durante y después de actualizar. Historial ADA y lotes deben reconciliarse con las tenencias. Datos ausentes no se tratan como cero. Los valores cambian por nuevos datos, no por terminar. Envíos, gastos y comisiones reducen coste proporcional; transferencias internas no reinician la media. Precios diarios aproximan la recepción, no ejecución ni impuestos. Tokens usan FIFO, pagos de mint o tu entrada. Se excluyen ganancias realizadas; las tenencias reflejan comisiones."
portfolio_text_d6d6856c5d03 = "Transferencias internas requieren todas las entradas y salidas propias. El cambio neto es solo la comisión. Transacciones mixtas se separan. Compras/ventas se infieren de cambios opuestos ADA/token; órdenes DEX de varias etapas pueden necesitar reconciliación."
portfolio_text_510101dca312 = "Excluye valor, coste y ganancias/pérdidas de totales y cobertura. Conserva detalles. Movimientos ADA y comisiones no cambian. Se guarda para este portfolio."
portfolio_text_ffe6a0dfd770 = "Las direcciones guardadas usan tu regla CEX: ADA entrante es compra, saliente es venta. No decodifica swaps DEX. Se guarda en tu almacenamiento elegido."
portfolio_text_f350e932f9d5 = "Referencias de contratos publicadas, no tus wallets. No cambian saldos, totales CEX ni comisiones. Los hashes identifican contratos, no direcciones de pago. No es un directorio completo."
portfolio_text_7e78d2eef3dc = "Disponible en escritorio, móvil y tablet con wallet compatible. Requiere aprobación de mensaje, sin transacción ni comisión. El navegador cifra con AES-256-GCM; firma y clave no se envían. Usa la misma cuenta y wallet compatible en otro dispositivo. Sin recuperación administrativa. Se borra tras siete días inactivos; actualizar en segundo plano no amplía el plazo."
portfolio_text_7a171b8b87ff = "Ambos modos consultan datos públicos de cadena y precios. El cifrado protege la caché guardada, no datos desbloqueados frente a código o extensiones maliciosas."
portfolio_text_6708d46d11c6 = "Sin copiar se cargan los datos de la ubicación elegida. Cambiar no elimina la otra copia."
portfolio_text_7d3859f071d8 = "Transacciones guardadas sin vínculo conocido. Selecciona tu dirección para verificar y analizar. Solo entradas y salidas reales determinan importes."
portfolio_text_09fbf60bffa4 = "Las excluidas conservan saldos e historial. Los cambios se aplican en la próxima actualización. Transacciones compartidas pueden actualizarse por otra dirección."
portfolio_text_ba6bcd6b3673 = "Tras analizar, las direcciones con menos de 10 transacciones se omiten en actualizaciones normales. Saldos y transacciones siguen siendo tuyos. Usa el reescaneo para revisarlas."
