portfolio_text_b49844af63a7 = "Tu dirección de stake verificada se añade automáticamente. Portfolio carga direcciones vinculadas, saldos y transacciones. Abre Wallets de Cardano para añadir wallets propias y gestionar etiquetas de exchanges y Swap."
portfolio_text_7c439812b22a = "Wallets de Cardano cuenta direcciones activas y analizadas con al menos 10 transacciones. Mis wallets cuenta las wallets que las contienen. Las direcciones ocultas o excluidas no cuentan aquí; saldos, titularidad y ganancias/pérdidas no cambian."
portfolio_text_00597ed883d1 = "Las direcciones con menos de 10 transacciones cargadas se ocultan por defecto. Desactiva el filtro para verlas. Tras analizarlas, se omiten en actualizaciones normales, conservando saldos, historial y titularidad. Usa Volver a escanear todas las wallets; mostrarlas no reinicia el escaneo."
portfolio_text_c7ab702881c8 = "Pulsa el nombre o el número de direcciones para ver Wallet, Dirección, ADA y Transacciones por dirección. Los enlaces abren Cardanoscan. Los recuentos corresponden al historial cargado y analizado."
portfolio_text_16b12395c134 = "Excluir de actualización omite consultas de saldo e historial de esa dirección, conservando caché y titularidad. Las transacciones compartidas pueden actualizarse mediante otra dirección activa. Puedes cambiarlo durante la actualización. Se necesita un saldo guardado para excluir."
portfolio_text_bc95ec437aeb = "Ocultar direcciones excluidas solo oculta filas. Desactívalo para reactivar una dirección y comprobar el historial pendiente. La tarjeta muestra direcciones de pago únicas activas / totales, no cuentas de stake ni etiquetas de exchanges."
portfolio_text_53fe1bca6511 = "Seleccionar todo excluye de actualización las direcciones con saldo guardado. Deseleccionar todo las reactiva. Ambos incluyen direcciones ocultas y guardan la selección en el almacenamiento elegido."
portfolio_text_3224f5e247c2 = "Usa el icono de actualización. Primero se cargan direcciones y saldos, después se cuentan y analizan transacciones en paralelo. La tarjeta Transacciones muestra progreso y subidas. Los valores se actualizan durante el proceso y pueden estar incompletos."
portfolio_text_71cc8c4b7374 = "Se reutiliza el historial guardado cuando es posible. Nuevas direcciones o análisis pendiente pueden tardar más. Cerrar una ventana secundaria no cancela la actualización; deja la web abierta. Los saldos excluidos pueden quedar desactualizados."
portfolio_text_20d87b0cd7c6 = "Tras un escaneo completo se reutiliza la lista guardada para consultar saldos y nuevas transacciones. Las wallets nuevas se escanean aparte. Añade mediante Mis wallets las nuevas direcciones de pago de una stake key existente; no se detectan automáticamente."
portfolio_text_2a28ea75fc03 = "Después del análisis se eliminan de la lista las direcciones sin transacciones, saldo ni activos, y se omiten en adelante. Se conservan las excluidas o incompletas. Esto no cambia tu stake key on-chain. Si vuelven a recibir fondos, añádelas en Mis wallets."
portfolio_text_dfdbf576d1a3 = "Volver a escanear todas las wallets redescubre direcciones y revisa todo su historial, incluidas las eliminadas o excluidas. Solo para este escaneo se ignoran exclusiones. Se reutilizan detalles guardados y se eliminan de nuevo direcciones vacías al terminar."
portfolio_text_6a4d08c5014d = "Las transacciones y el análisis se guardan antes de actualizar precios e imágenes. Un fallo de metadatos no elimina las transacciones guardadas. El estado indica si terminó el análisis y siguen cargándose datos de tokens."
portfolio_text_001a76011c42 = "Activos en todas las wallets muestra el valor actual de ADA y activos valorados, en USD y su equivalente ADA al precio actual. Ábrelo para ver activos, wallets y detalles. Los activos sin precio no se incluyen en el subtotal."
portfolio_text_8f0e993752c8 = "Los detalles comparan el valor actual con el coste de compra. Los costes de mint y compra no son precios actuales. Los precios mínimos NFT y el valor alternativo de 2 ADA son estimaciones, no ventas garantizadas. Gestiona precios manuales y exclusiones en los detalles."
portfolio_text_e5113f14d525 = "Comisiones de red pagadas incluye comisiones atribuibles de transacciones cargadas; se excluyen las de entradas compartidas sin atribución fiable."
portfolio_text_f4fa3c5eb23b = "Ganancias/Pérdidas ADA es ADA OUT más el valor actual de Activos en todas las wallets menos ADA IN. ADA y activos usan valores actuales, no costes de compra. Las transferencias USD usan precios del día de transferencia; los activos se convierten a ADA al precio actual. Los activos sin precio se excluyen, por lo que el resultado puede ser parcial. No es un cálculo fiscal."
portfolio_text_bfcc16d4d5c7 = "Las etiquetas DEX / CEX identifican contrapartes en ambos sentidos. Son tus etiquetas, no titularidad verificada, y no añaden sus saldos al portfolio."
portfolio_text_656711e3e164 = "Revisa las direcciones en Byron DEX / CEX y desmarca las que no sean exchanges. Las transacciones compartidas se cuentan una vez; Ver muestra transacciones y direcciones."
portfolio_text_11b9eecc6c6a = "Swap identifica direcciones internas/de servicio excluidas de CEX. La etiqueta no acredita propiedad de toda la wallet del servicio. Los importes se vinculan a tus direcciones para no contar fondos de otros destinatarios."
portfolio_text_1aef2faecf54 = "Abre Transacciones para buscar por activo, hash o dirección. Usa filtros de tipo, fecha y páginas. Verifica en Cardanoscan. Las imágenes abren detalles con compras disponibles y ajustes manuales."
portfolio_text_6adc466b0d48 = "Titularidad desconocida muestra transacciones guardadas sin vínculo conocido a tus direcciones. Un análisis ausente no implica necesariamente que pertenezcan a otra persona."
portfolio_text_807546dc54f5 = "Selecciona una dirección seguida y pulsa Asignar. Se verifica su presencia en entradas o salidas. Solo datos verificados determinan titularidad e importes; seleccionar no convierte fondos ajenos en tuyos. Añade primero tu wallet si falta la dirección."
portfolio_text_5aed3b3369fb = "Espera a que termine la actualización o verificación. Las asignaciones correctas se guardan y salen de la lista. Una verificación fallida no cambia titularidad ni importes. Comprueba en Cardanoscan."
portfolio_text_0d9496b97e02 = "Los datos locales se cifran con AES-256-GCM antes de guardarse. Se desbloquean con una aprobación de mensaje separada, sin transacción, comisión ni subida. Usa la misma app y cuenta de stake. No hay recuperación sin wallet. Tras siete días inactivos se borran en la siguiente visita."
portfolio_text_61e7830a5582 = "El almacenamiento remoto cifrado admite wallets móviles compatibles. Se desbloquea con un mensaje separado, sin transacción ni comisión ADA. Se cifra antes de subir. Usa la misma cuenta de stake y una wallet compatible en otro dispositivo. El administrador no puede recuperar el acceso perdido."
portfolio_text_301f1b40b266 = "Las cachés remotas se borran tras siete días inactivas y las locales caducadas en la siguiente visita. Cambiar no borra la otra copia; revisa copiar y eliminar. Ambos modos consultan datos públicos del backend. El cifrado no protege datos desbloqueados frente a código o extensiones maliciosas."
portfolio_text_e2933cc452e5 = "Revisa siempre la solicitud y el dominio. Acceso y desbloqueo usan firmas de mensajes, no pagos. Rechaza transacciones o transferencias inesperadas. Verifica las estimaciones con tu wallet y datos on-chain."
