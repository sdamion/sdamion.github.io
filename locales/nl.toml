portfolio_text_b49844af63a7 = "Je geverifieerde stakeadres wordt automatisch toegevoegd. Portfolio zoekt gekoppelde betaaladressen, laadt saldi en analyseert transacties. Open Wallets om eigen wallets toe te voegen of exchange- en Swap-labels te beheren."
portfolio_text_7c439812b22a = "Wallets telt alleen actieve, volledig geanalyseerde adressen met minstens 10 transacties. Mijn wallets telt wallets met zulke adressen. Verborgen en uitgesloten adressen tellen hier niet mee; saldi, transactie-eigendom en winst/verlies blijven ongewijzigd."
portfolio_text_00597ed883d1 = "Adressen met minder dan 10 geladen transacties zijn standaard verborgen. Schakel het filter uit om ze te zien. Na volledige analyse worden ze bij normale verversingen overgeslagen. Saldi, historie en eigendom blijven bewaard. Gebruik Alle wallets opnieuw scannen om ze te controleren; alleen zichtbaar maken start geen scan."
portfolio_text_c7ab702881c8 = "Klik op een walletnaam of het aantal gekoppelde adressen om Wallet, Adres, ADA en Transacties per adres te zien. Adreslinks openen Cardanoscan. Aantallen zijn gebaseerd op de geladen, geanalyseerde historie."
portfolio_text_16b12395c134 = "Uitsluiten van verversing slaat saldo- en historieaanvragen voor dat adres over. Cachegegevens en eigendom blijven behouden. Gedeelde transacties kunnen via een ander actief adres worden bijgewerkt. Je kunt dit tijdens verversen wijzigen. Uitsluiten vereist een eerder opgeslagen saldo."
portfolio_text_bc95ec437aeb = "Uitgesloten adressen verbergen verbergt alleen rijen, niet de gegevens. Schakel dit uit om een adres opnieuw te activeren; gemiste historie wordt dan gecontroleerd. De tegel Wallets toont actieve / totale unieke betaaladressen, geen stakeaccounts of exchangelabels."
portfolio_text_53fe1bca6511 = "Alles selecteren sluit alle adressen met opgeslagen saldo in die wallet uit van verversing. Alles deselecteren activeert verversen weer. Beide nemen ook verborgen adressen mee en bewaren de keuze in je Portfolio-opslag."
portfolio_text_3224f5e247c2 = "Gebruik het verversicoon bovenaan. Portfolio zoekt eerst adressen en laadt saldi, daarna telt en analyseert het transacties tegelijk. De tegel Transacties toont voortgang en uploads. Waarden worden tussentijds bijgewerkt en kunnen nog onvolledig zijn."
portfolio_text_71cc8c4b7374 = "Bestaande historie wordt waar mogelijk hergebruikt. Nieuwe adressen of ontbrekende analyse kunnen langer duren. Een onderliggende overlay sluiten stopt de verversing niet; laat de website open. Uitgesloten saldi blijven opgeslagen en kunnen verouderen."
portfolio_text_20d87b0cd7c6 = "Na een volledige scan gebruikt verversen de opgeslagen adreslijst en controleert saldi en nieuwe transacties. Nieuwe wallets worden apart gescand. Nieuwe betaaladressen onder een bestaande stakekey worden niet automatisch gevonden; voeg ze toe via Mijn wallets."
portfolio_text_2a28ea75fc03 = "Na volledige analyse worden gekoppelde adressen zonder transacties, saldo of assets uit de opgeslagen lijst verwijderd en voortaan overgeslagen. Uitgesloten of onvolledige adressen blijven bewaard. Dit wijzigt je on-chain stakekey niet. Voeg een later gebruikt adres opnieuw toe via Mijn wallets."
portfolio_text_dfdbf576d1a3 = "Alle wallets opnieuw scannen zoekt alle gekoppelde adressen en controleert hun volledige historie, ook verwijderde of uitgesloten adressen. Uitsluitingen worden alleen voor deze scan genegeerd. Opgeslagen transactiedetails worden hergebruikt; lege adressen worden na volledige analyse weer verwijderd."
portfolio_text_6a4d08c5014d = "Transacties en analyse worden opgeslagen voordat tokenprijzen en afbeeldingen worden ververst. Een metadatafout verwijdert opgeslagen transacties niet. De status toont wanneer analyse klaar is maar tokendata nog laadt."
portfolio_text_001a76011c42 = "Assets in alle wallets toont de actuele waarde van ADA en gewaardeerde assets, in USD en omgerekend naar ADA tegen de huidige koers. Open de tegel voor holdings, walletnamen en assetdetails. Assets zonder prijs tellen niet mee in het subtotaal."
portfolio_text_8f0e993752c8 = "Assetdetails vergelijken de actuele waarde met de aankoopkosten. Mint- en aankoopkosten zijn geen actuele prijzen. NFT-floorprijzen en de 2 ADA-terugvalwaarde zijn schattingen, geen gegarandeerde verkoopprijzen. Beheer handmatige prijzen en uitsluitingen bij de assetdetails."
portfolio_text_e5113f14d525 = "Betaalde netwerkfees bevat toewijsbare fees uit geladen transacties. Fees van gedeelde inputs die niet betrouwbaar kunnen worden toegewezen, zijn uitgesloten."
portfolio_text_f4fa3c5eb23b = "ADA-Winst/Verlies is ADA UIT plus de actuele Assets in alle wallets min ADA IN. ADA en assets in wallets gebruiken de actuele waarde, niet de aankoopkosten. USD-transfers gebruiken de koers op de transferdatum; assets worden omgerekend naar ADA tegen de huidige koers. Assets zonder prijs tellen niet mee, waardoor de uitkomst gedeeltelijk kan zijn. Dit is geen belastingberekening."
portfolio_text_bfcc16d4d5c7 = "DEX / CEX-labels herkennen exchange-tegenpartijen in beide richtingen. Het zijn jouw labels, geen geverifieerd exchange-eigendom. Hun saldi worden niet aan je portfolio toegevoegd."
portfolio_text_656711e3e164 = "Controleer ontdekte adressen in Byron DEX / CEX. Deselecteer adressen die geen exchange zijn. Gedeelde transacties tellen eenmaal; Bekijken toont transacties en adressen."
portfolio_text_11b9eecc6c6a = "Swap herkent interne/serviceadressen die niet als CEX mogen tellen. Een Swap-label bewijst geen eigendom van de hele servicewallet. Bedragen worden aan je gevolgde walletadressen gekoppeld zodat andere ontvangers niet als jouw geld tellen."
portfolio_text_1aef2faecf54 = "Open Transacties om op assetnaam, transactiehash of adres te zoeken. Gebruik type- en datumfilters en paginering. Verifieer transacties via Cardanoscan. Assetafbeeldingen openen details met beschikbare aankoopgegevens en handmatige aanpassingen."
portfolio_text_6adc466b0d48 = "Onbekend eigendom toont opgeslagen transacties zonder bekende koppeling aan je gevolgde walletadressen. Ontbrekende analyse betekent niet noodzakelijk dat de transactie van iemand anders is."
portfolio_text_807546dc54f5 = "Open de tegel, kies een gevolgd walletadres en druk op Toewijzen. Portfolio controleert of dit adres in de inputs of outputs staat. Alleen geverifieerde transactiedata bepaalt eigendom en bedragen; een selectie maakt andermans geld niet van jou. Voeg eerst je eigen wallet toe als het adres ontbreekt."
portfolio_text_5aed3b3369fb = "Wacht tot verversen of verificatie klaar is. Geslaagde toewijzingen worden opgeslagen en uit de onbekende lijst verwijderd. Een mislukte controle wijzigt eigendom en bedragen niet. Controleer via Cardanoscan."
portfolio_text_0d9496b97e02 = "Lokale gegevens worden vóór opslag met AES-256-GCM versleuteld. Een aparte walletberichtgoedkeuring ontgrendelt ze; geen transactie, fee of upload. Gebruik dezelfde walletapp en stakeaccount. Zonder wallettoegang is herstel onmogelijk. Na zeven dagen inactiviteit wordt verlopen data bij je volgende bezoek verwijderd."
portfolio_text_61e7830a5582 = "Versleutelde externe opslag ondersteunt ook compatibele mobiele wallets. Ontgrendel via een aparte walletberichtgoedkeuring, zonder transactie of ADA-fee. Versleuteling gebeurt vóór upload in je browser. Gebruik dezelfde stakeaccount en een compatibele wallet op een ander apparaat. Bij verlies van toegang kan de beheerder niets herstellen."
portfolio_text_301f1b40b266 = "Externe caches worden na zeven dagen inactiviteit verwijderd; lokale verlopen data bij je volgende bezoek. Wisselen verwijdert de andere kopie niet. Controleer kopiëren en verwijderen zorgvuldig. Beide opties vragen publieke blockchain- en prijsdata aan de backend. Versleuteling beschermt ontgrendelde data niet tegen kwaadaardige extensies of websitecode."
portfolio_text_e2933cc452e5 = "Controleer altijd het walletverzoek en websitedomein. Toegang en cacheontgrendeling gebruiken berichtondertekening, geen betalingen. Weiger onverwachte transacties of transfers. Verifieer schattingen met je wallet en on-chain gegevens."
