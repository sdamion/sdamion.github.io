portfolio_text_5ca5237c7f66 = "{name} uit Swap verwijderen"
portfolio_text_328a4d4c6ba2 = "Bijgewerkt {date}"
portfolio_text_29c296a1f5f9 = "Resterende kosten worden tijdens en na verversen hetzelfde berekend. ADA-historie moet aansluiten op het saldo; tokenlots op de huidige holding. Ontbrekende historie of prijzen zijn niet nul. Nieuwe data wijzigt waarden, niet het afronden van verversen. Verzenden, uitgaven en fees verwijderen evenredige ADA-kosten; interne transfers resetten het gemiddelde niet. Dagprijzen benaderen ontvangstprijzen, geen exchange-uitvoeringsprijs of belastingberekening. Tokenkosten gebruiken FIFO, mintbetalingen of jouw invoer. Gerealiseerde winst is uitgesloten; fees zijn al in holdings verwerkt."
portfolio_text_d6d6856c5d03 = "Interne transfers vereisen dat alle inputs en outputs bij gevolgde adressen horen. Netto verandert alleen de fee. Gemengde transacties blijven apart. Koop/verkoop wordt afgeleid uit tegengestelde ADA- en tokenwijzigingen; DEX-orders met meerdere stappen kunnen extra controle vereisen."
portfolio_text_510101dca312 = "Sluit assetwaarde, aankoopkosten en winst/verlies uit van totalen en dekking. Details blijven zichtbaar. ADA-bewegingen en netwerkfees veranderen niet. De keuze wordt voor dit portfolio opgeslagen."
portfolio_text_ffe6a0dfd770 = "Opgeslagen exchangeadressen gebruiken jouw CEX-regel: inkomende ADA is koop, uitgaande ADA verkoop. Dit decodeert geen DEX-swaps. Opgeslagen in je gekozen Portfolio-opslag."
portfolio_text_f350e932f9d5 = "Gepubliceerde contractreferenties, niet je eigen wallets. Ze wijzigen geen saldi, CEX-totalen of betaalde fees. Script-hashes herkennen contracten, geen betaaladressen. Dit is geen volledige DEX-lijst."
portfolio_text_7e78d2eef3dc = "Beschikbaar op desktop, telefoon en tablet met compatibele wallet. Aparte berichtgoedkeuring, geen transactie of fee. De browser versleutelt met AES-256-GCM vóór upload. Handtekening en sleutel blijven lokaal. Gebruik dezelfde stakeaccount en compatibele wallet op een ander apparaat. Geen beheerderherstel. De server verwijdert caches na zeven dagen inactiviteit; achtergrondverversen verlengt dit niet."
portfolio_text_7a171b8b87ff = "Beide opties vragen publieke blockchain- en prijsdata aan de backend. Versleuteling beschermt opgeslagen cache, niet tegen kwaadaardige websitecode of extensies terwijl ontgrendeld."
portfolio_text_6708d46d11c6 = "Zonder kopiëren laadt de gekozen locatie haar eigen gegevens. Wisselen verwijdert de andere kopie niet."
portfolio_text_7d3859f071d8 = "Opgeslagen transacties zonder bekende walletkoppeling. Kies je adres voor controle en analyse. Alleen werkelijke inputs en outputs bepalen bedragen."
portfolio_text_09fbf60bffa4 = "Uitgesloten adressen behouden opgeslagen saldi en transacties. Wijzigingen gelden bij de volgende verversing. Gedeelde transacties kunnen via een ander walletadres worden bijgewerkt."
portfolio_text_ba6bcd6b3673 = "Na volledige analyse worden adressen met minder dan 10 transacties overgeslagen bij normale verversingen. Saldi en transacties blijven van jou. Gebruik Alle wallets opnieuw scannen voor een nieuwe controle."
portfolio_text_6493809745be = "Ververs om stakeadressen van afzenders en ontvangers bij oudere transacties te laden."
