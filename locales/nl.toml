portfolio_text_067b22f4142f = " Portfolio-cache voor dit lid? Wallets, exchangelabels, handmatige prijzen en analyse in deze kopie worden verwijderd. Blockchaintransacties en de andere opslaglocatie blijven ongewijzigd."
portfolio_text_471a31b1a33b = "Je stakeadres omvat gekoppelde betaaladressen. Voeg alleen eigen wallets toe."
portfolio_text_40d4f0a54c11 = "Zoek gekoppelde adressen opnieuw en controleer volledige historie, inclusief uitgesloten adressen alleen voor deze scan. Opgeslagen transactiedetails worden hergebruikt."
portfolio_text_315c1eba757d = "Wallets, ingevoerde prijzen en historie gebruiken je gekozen versleutelde opslag. Handmatige prijzen en gemiddelde kosten blijven per asset en lid bewaard, ook bij walletwijzigingen."
portfolio_text_19e2e5758c3e = "Bepaalt opname in het totale asset-winst/verlies. Saldi, assetwaarden, fees en ADA IN/UIT blijven ongewijzigd."
portfolio_text_88269ee53025 = "Sommige betalingskoppelingen passen niet bij de geladen historie. Open de assetafbeelding om aankopen te controleren."
portfolio_text_6f1c5c732170 = "Gekoppelde mintbetalingen zijn aankoopkosten, geen actuele prijzen. Winst/verlies vereist een marktprijs of ingevoerde actuele prijs."
portfolio_text_0fc3055537aa = "Controleer dat de betaling bij dit asset hoort. Geef bij bundels alleen het aandeel van dit asset op. Een aparte betaling moet een geladen uitgaande ADA-transactie zonder tokens zijn."
portfolio_text_d844eb2cb753 = "Swap-adressen zijn uitgesloten van CEX. Bedragen worden aan gevolgde walletadressen gekoppeld, inclusief je stakekey. Andere ontvangers en gedeelde servicesaldi tellen niet als jouw geld."
portfolio_text_cc8002de133b = "Byron-adressen zijn standaard geselecteerd. Deselecteer niet-exchangeadressen en sla op. Exchange-eigendom is niet geverifieerd. Eigen wallets en Swap zijn uitgesloten. De selectie wordt opgeslagen maar voegt geen walletsaldо toe."
